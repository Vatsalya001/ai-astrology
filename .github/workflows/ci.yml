name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Without an explicit block the token inherits the
# repository default, which may be write-all — more than any job here
# needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI MUST NEVER CALL A LANGUAGE MODEL.
  # Tests that depend on a real model are slow, flaky, non-deterministic
  # and eventually expensive. Phase 4 ships a MockProvider returning
  # fixtures; real-model evals run on demand in Phase 6, never here.
  LLM_PROVIDER: mock
  LLM_PROVIDER_TIER: local

jobs:
  go:
    name: Go — api-service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U astro"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The toolchain directive in go.mod pins the actual compiler
          # used; this just needs to be new enough to honour it.
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # -race is not optional: this service does concurrent billing from
      # Phase 7 onward, and the race detector is how those bugs get found
      # before users find them.
      - run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Check for vulnerable dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-integration:
    name: Go — integration (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      # Ryuk is testcontainers' cleanup sidecar. GitHub runners are
      # ephemeral, so it buys nothing and occasionally flakes.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum

      # Proves the single-writer rule holds: astro_ro can SELECT and
      # cannot INSERT, UPDATE, DELETE, TRUNCATE or CREATE TABLE. Runs the
      # REAL bootstrap SQL, so weakening those grants fails CI.
      # REQUIRE_CONTAINERS turns "Docker is unavailable" from a skip into a
      # failure. Without it, a runner that loses Docker skips every
      # integration test, `go test` reports ok, and this job passes having
      # proven none of the things it exists to prove.
      - run: go test ./... -tags=integration -race -count=1
        env:
          REQUIRE_CONTAINERS: '1'

  contracts:
    name: Cross-service contracts are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum
      - uses: astral-sh/setup-uv@v3

      - name: Regenerate OpenAPI documents and Go clients
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
          uv run --directory services/astro python -m app.export_openapi > contracts/openapi/astro.json
          uv run --directory services/ai    python -m app.export_openapi > contracts/openapi/ai.json
          oapi-codegen -config contracts/astro-client.yaml contracts/openapi/astro.json
          oapi-codegen -config contracts/ai-client.yaml    contracts/openapi/ai.json
          gofmt -w services/api/internal/platform/clients

      # A cross-service contract must never change without the diff being
      # visible in review. Never hand-write these clients (ADR-005).
      - name: Fail if the committed output drifted
        run: |
          if ! git diff --exit-code contracts/ services/api/internal/platform/clients/; then
            echo "::error::Contracts are out of date. Run 'task contracts' and commit the result."
            exit 1
          fi

  integrity:
    name: Working tree matches the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A fresh checkout, so any mismatch here is the checkout itself
      # being wrong rather than somebody's edit — which makes this the
      # one place the check is unambiguous.
      #
      # It exists because two tracked files were observed holding wrong
      # bytes on a developer machine on 2026-09-18 — the JPL ephemeris
      # kernel and a golden fixture — while `git status`, `git diff` and
      # `git update-index --really-refresh` all reported a clean tree.
      # Only re-hashing found them, and both had surfaced until then as
      # puzzling test failures.
      - name: Every tracked file matches its blob
        run: ./scripts/check-integrity.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans full history, not just the tip

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The gitleaks ACTION is deliberately not used. It calls the
      # PR-commits API, which 403s without pull-requests:read, so the job
      # behaved differently on a pull_request than on a push — and the
      # push path was the only one ever exercised, so that went unnoticed.
      #
      # The CLI scans full history identically on both events and is
      # exactly what `task secrets` runs locally, so a green CI means the
      # same thing a green local run means.
      - name: Scan full history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks detect --source . --redact --no-banner --exit-code 1

  python:
    name: Python — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [astro, ai]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict app
      - run: uv run pytest -q

      # Python's half of the dependency-audit requirement. Go has
      # govulncheck and the web has npm audit; without this the Python
      # services were the only unaudited part of the stack.
      - name: Audit Python dependencies
        run: uvx pip-audit --strict --progress-spinner=off

  # A dedicated job, because this is the single most important structural
  # guarantee in the system and it deserves to fail visibly and by name
  # rather than being buried in a test matrix.
  determinism-guard:
    name: astro-service is AI-free
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/astro
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - name: Assert no LLM SDK can be reached from astro-service
        run: uv run pytest tests/test_no_llm_imports.py -v

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspace=web

      # --workspaces, not --workspace=web.
      #
      # This said `--workspace=web` while `typecheck` above already said
      # `--workspaces`, so a test script in any package under packages/
      # was silently skipped. Adding `@ayana/astrology-geometry` with 27
      # tests would have run none of them in CI while passing locally —
      # the worst kind of green.
      - run: npm run test --workspaces --if-present

      - run: npm run build --workspace=web

      # Task 3.19: the bundle check fails the build if a budget is
      # exceeded. Immediately after the build, because it reads the
      # stats that build just produced — and it exits non-zero when
      # those are missing rather than skipping, so a reordering that
      # breaks it shows up as a red build rather than a silent pass.
      - name: Bundle budget
        run: npm run budget --workspace=web

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: E2E (browser against the real stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The same script a developer runs, not a reimplementation of it.
      #
      # CI used to start the stack with its own inline steps, which meant
      # it wrote the API log to /tmp/api.log while scripts/ayana writes to
      # .run/api.log. The e2e suite reads that log to get the OTP, so it
      # passed locally and failed here — the textbook "works on my
      # machine" caused by CI and local being different code paths.
      - name: Start the whole stack
        run: |
          cp .env.example .env
          ./scripts/ayana up

      - name: Show what is running
        run: ./scripts/ayana status

      # The only test that exercises browser -> Go API -> Python. Every
      # other suite stubs at a boundary.
      - run: npx playwright test

      - name: Service logs on failure
        if: failure()
        run: |
          echo "--- api ---";  tail -80 .run/api.log || true
          echo "--- web ---";  tail -40 .run/web.log || true
          docker compose logs --tail=50

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  env-drift:
    name: .env.example matches config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every env var read by Go must exist in .env.example
        run: |
          missing=0
          # Extract `env:"NAME"` tags from the Go config struct.
          grep -oP 'env:"\K[A-Z0-9_]+' services/api/internal/config/config.go | sort -u > /tmp/declared.txt
          while read -r var; do
            if ! grep -qE "^${var}=" .env.example; then
              echo "::error::${var} is read by config.go but absent from .env.example"
              missing=1
            fi
          done < /tmp/declared.txt
          exit $missing
