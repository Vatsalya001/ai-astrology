# One command surface across three toolchains.
#
# Go, Python and TypeScript each have their own idea of how to build,
# lint and test. Without this file every developer has to remember nine
# commands; with it they remember four.
#
# Requires: https://taskfile.dev  (go install github.com/go-task/task/v3/cmd/task@latest)

version: '3'

dotenv: ['.env']

vars:
  API_DIR: services/api
  ASTRO_DIR: services/astro
  AI_DIR: services/ai
  GOBIN:
    sh: go env GOPATH

env:
  PATH: '{{.GOBIN}}/bin:{{.PATH}}'

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: Install every dependency and create .env (idempotent — safe to re-run)
    # `task verify` depends on this so that a fresh clone reaches green
    # with one command. Each step is a near no-op once satisfied:
    # npm install and uv sync both short-circuit when the lockfile
    # matches, and go mod download is cached.
    cmds:
      - '[ -f .env ] || { cp .env.example .env; echo "created .env from .env.example"; }'
      - npm install --no-fund --no-audit
      # --all-extras matches CI. Without it, mypy locally falls back to
      # Any for the optional observability packages and a type error is
      # only caught after pushing.
      - uv sync --directory {{.ASTRO_DIR}} --all-extras
      - uv sync --directory {{.AI_DIR}} --all-extras
      - cd {{.API_DIR}} && go mod download
      - task: hooks

  # ─── Infrastructure ───────────────────────────────────────────────

  up:
    desc: Start Postgres, Redis, MinIO and Mailpit
    cmds:
      - docker compose up -d
      - echo "Postgres :5433 · Redis :6381 · MinIO :9001 · Mailpit :8025"

  down:
    desc: Stop all containers
    cmds: [docker compose down]

  nuke:
    desc: Stop containers AND delete all volumes (destroys local data)
    prompt: This deletes your local database and object storage. Continue?
    cmds: [docker compose down -v]

  # ─── Development ──────────────────────────────────────────────────

  dev:
    desc: Run every service (use separate terminals, or `task --parallel dev`)
    deps: [dev:api, dev:astro, dev:ai, dev:web]

  dev:api:
    desc: Run the Go API with live reload
    dir: '{{.API_DIR}}'
    cmds: [go run ./cmd/api]

  dev:worker:
    desc: Run the Go background worker
    dir: '{{.API_DIR}}'
    cmds: [go run ./cmd/worker]

  dev:astro:
    desc: Run astro-service from source with live reload
    # Stops the container first: compose publishes 8100, so both cannot
    # run at once.
    cmds:
      - docker compose stop astro
      - uv run --directory {{.ASTRO_DIR}} uvicorn app.main:app --reload --port 8100

  dev:ai:
    desc: Run ai-service from source with live reload
    cmds:
      - docker compose stop ai
      - uv run --directory {{.AI_DIR}} uvicorn app.main:app --reload --port 8200

  dev:web:
    desc: Run the Next.js web app
    cmds: [npm run dev --workspace=web]

  # ─── Database ─────────────────────────────────────────────────────

  migrate:
    desc: Apply all pending migrations
    cmds:
      - migrate -path {{.API_DIR}}/db/migrations -database "$DATABASE_URL" up

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - migrate -path {{.API_DIR}}/db/migrations -database "$DATABASE_URL" down 1

  migrate:new:
    desc: 'Create a migration pair — usage: task migrate:new -- add_users'
    cmds:
      - migrate create -ext sql -dir {{.API_DIR}}/db/migrations -seq {{.CLI_ARGS}}

  sqlc:
    desc: Regenerate type-safe Go from db/queries/*.sql
    dir: '{{.API_DIR}}'
    cmds: [sqlc generate]

  contracts:
    desc: Regenerate OpenAPI documents and the typed Go clients
    # Never hand-write a cross-service client (ADR-005). CI fails if the
    # committed output differs from what the source produces, which is
    # what makes a contract change visible in review.
    cmds:
      - uv run --directory {{.ASTRO_DIR}} python -m app.export_openapi > contracts/openapi/astro.json
      - uv run --directory {{.AI_DIR}}    python -m app.export_openapi > contracts/openapi/ai.json
      - oapi-codegen -config contracts/astro-client.yaml contracts/openapi/astro.json
      - oapi-codegen -config contracts/ai-client.yaml    contracts/openapi/ai.json
      - cd {{.API_DIR}} && gofmt -w internal/platform/clients

  psql:
    desc: Open a psql shell against the dev database
    cmds: [docker compose exec postgres psql -U astro -d astro_dev]

  # ─── Quality gates ────────────────────────────────────────────────

  lint:
    desc: Lint every language
    cmds:
      - task: lint:go
      - task: lint:py
      - task: lint:web

  lint:go:
    dir: '{{.API_DIR}}'
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

  lint:py:
    cmds:
      - uv run --directory {{.ASTRO_DIR}} ruff check .
      - uv run --directory {{.ASTRO_DIR}} mypy --strict app
      - uv run --directory {{.AI_DIR}} ruff check .
      - uv run --directory {{.AI_DIR}} mypy --strict app

  lint:web:
    # Both, not either. `tsc` is a type checker and ESLint is a linter;
    # they catch disjoint sets of bug. This task used to run typecheck
    # alone, which meant the TypeScript half of the repo had no linter
    # while Go had golangci-lint and Python had ruff.
    cmds:
      - npm run typecheck --workspaces --if-present
      - npm run lint --workspace=web

  fmt:
    desc: Auto-format everything
    cmds:
      - cd {{.API_DIR}} && gofmt -w .
      - uv run --directory {{.ASTRO_DIR}} ruff format .
      - uv run --directory {{.AI_DIR}} ruff format .

  test:
    desc: Run every test suite
    cmds:
      - task: test:go
      - task: test:py

  test:go:
    dir: '{{.API_DIR}}'
    # -race is not optional: this service does concurrent billing from
    # Phase 7 onward, and the race detector is how those bugs are found
    # before users find them.
    cmds: [go test ./... -race -count=1]

  test:py:
    cmds:
      - uv run --directory {{.ASTRO_DIR}} pytest -q
      - uv run --directory {{.AI_DIR}} pytest -q

  test:e2e:
    desc: End-to-end browser tests (needs the stack running — task up + task dev)
    cmds:
      - npx playwright test

  test:integration:
    desc: Integration tests against real containers (needs Docker)
    dir: '{{.API_DIR}}'
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    cmds:
      - go test ./... -tags=integration -race -count=1

  hooks:
    desc: Install git hooks (pre-commit secret scan)
    cmds:
      - cp scripts/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo "installed .git/hooks/pre-commit"

  audit:
    desc: Audit dependencies in all three languages for known vulnerabilities
    cmds:
      - cd {{.API_DIR}} && govulncheck ./...
      - uvx pip-audit --strict --progress-spinner=off --path {{.ASTRO_DIR}}/.venv
      - uvx pip-audit --strict --progress-spinner=off --path {{.AI_DIR}}/.venv
      - npm audit --audit-level=high

  secrets:
    desc: Scan the working tree and full git history for secrets
    cmds:
      - gitleaks detect --source . --redact --verbose --no-banner

  build:
    desc: Build all production artefacts
    cmds:
      - cd {{.API_DIR}} && go build -o bin/api ./cmd/api && go build -o bin/worker ./cmd/worker
      - npm run build --workspace=web

  verify:
    desc: The commit gate — lint, test and build everything
    # Starts from setup so this passes on a clean clone. That is a gate
    # requirement, and it failed the first time it was actually tested:
    # verify assumed node_modules already existed.
    cmds:
      - task: setup
      - task: contracts
      # NOTE: the "did regeneration change anything?" check lives in CI,
      # not here. `git diff --exit-code` cannot distinguish contract drift
      # from ordinary uncommitted work, so locally it would fail on every
      # in-progress change. CI runs it against a clean checkout, where the
      # comparison is meaningful.
      - task: lint
      - task: test
      - task: build
      - echo "✓ verify passed"

  # ─── Operations ───────────────────────────────────────────────────

  health:
    desc: Print the aggregate health of the running stack
    cmds:
      - curl -s http://localhost:4000/health | python3 -m json.tool

  ollama:
    desc: Pull the free local models used for development
    cmds:
      - ollama pull llama3.2:3b
      - ollama pull qwen2.5:7b
      - ollama pull nomic-embed-text
