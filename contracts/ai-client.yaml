# Generated Go client for ai-service.
#
# Output lands inside services/api so the repo stays a single Go module —
# a separate module for two generated files would add replace directives
# and version skew for no benefit.
#
# DO NOT EDIT the generated file. Regenerate with: task contracts
# CI fails if the committed output differs from what the source produces,
# which is what makes a contract change visible in review.
package: aiclient
output: services/api/internal/platform/clients/aiclient/client.gen.go
generate:
  models: true
  client: true
output-options:
  skip-prune: true
