[project]
name = "ai-service"
version = "0.1.0"
description = "LLM orchestration, RAG, safety and evaluation. Read-only against the database."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # The official OpenAI SDK is used as a *client for Ollama*, which
    # serves an OpenAI-compatible endpoint at /v1. One adapter therefore
    # covers Ollama, LM Studio, Groq, OpenRouter and Cerebras — all of
    # which are free for development. See ADR-004.
    "openai>=1.54",
    # Phase 4 adds: anthropic (production provider)
    # Phase 5 adds: asyncpg, pgvector
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
# Optional. Install with: uv sync --extra observability
#
# Kept out of the default dependency set so development and CI stay
# lean, and so the absence of a collector is never a startup error.
observability = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "sentry-sdk>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # Enforces the vendor-SDK boundary below. The rule that only
    # app/providers/ may import openai/anthropic/google is the whole
    # reason a model swap is a config change — and a rule nothing checks
    # is a comment.
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# The observability extras are optional and deliberately not installed by
# default, so mypy cannot resolve them in a normal checkout. Scoped to
# these modules only — a blanket ignore_missing_imports would hide real
# missing-stub problems in every other dependency.
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


# ─── the vendor boundary ─────────────────────────────────────────────
#
# PHASE-04 §2, first line: "Nothing outside `app/providers/` may import a
# vendor SDK. Enforced by an import-linter contract in CI, not by
# convention — conventions erode."
#
# Run with: uv run lint-imports

[tool.importlinter]
root_package = "app"
# Required whenever a forbidden module is a third-party package rather
# than one of our own — without it import-linter only builds a graph of
# first-party imports and would report every contract as passing while
# seeing none of the SDK imports it exists to catch.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Vendor SDKs live only in app.providers"
type = "forbidden"
source_modules = [
    "app.api",
    "app.guards",
    "app.main",
    "app.middleware",
    "app.observability",
    "app.pricing",
    "app.prompts",
    "app.routing",
    "app.schemas",
    "app.settings",
    "app.telemetry",
]
forbidden_modules = [
    "openai",
    "anthropic",
    # `google` only: import-linter rejects subpackages of external
    # packages, and the top-level name covers google.generativeai and
    # google.genai — which is what we actually care about.
    "google",
    "litellm",
    "langchain",
    "ollama",
]
# Listed module by module rather than as "app" minus "app.providers",
# because import-linter's `forbidden` contract has no exclusion syntax
# and a wildcard source would forbid the providers package from importing
# the SDKs it exists to wrap.

[[tool.importlinter.contracts]]
name = "The base protocol depends on no adapter"
type = "forbidden"
source_modules = ["app.providers.base"]
forbidden_modules = [
    "openai",
    "anthropic",
    "google",
    "litellm",
    "ollama",
]
# base.py defines the seam. If it ever imports a vendor type, that type
# becomes part of the protocol and every other adapter has to construct
# it — which is the exact coupling this phase exists to avoid.
