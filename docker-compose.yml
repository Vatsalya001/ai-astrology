name: ayana

# ──────────────────────────────────────────────────────────────────────
#  `docker compose up -d` brings up the whole backend: infrastructure
#  plus both Python services.
#
#  For hot-reload development of a Python service, stop its container
#  first and run it from source — `task dev:astro` does both:
#      docker compose stop astro && uv run uvicorn ... --reload
#
#  api-service is deliberately NOT in here. It is the service you edit
#  most, and `task dev:api` running it from source is faster than any
#  container rebuild loop. Its Dockerfile exists for deployment.
# ──────────────────────────────────────────────────────────────────────

x-internal-token: &internal-token ${INTERNAL_TOKEN:-dev-internal-token-change-me}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayana-postgres
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astro_dev
    # Host port 5433, not 5432: this machine already runs a PostgreSQL
    # instance. Binding the standard port would either fail or, worse,
    # silently shadow it. Container-internal port is unchanged.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ayana-redis
    # Host port 6381: 6379 and 6380 are both already taken on this machine.
    ports: ["127.0.0.1:6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # quay.io, not Docker Hub: `minio/minio` there is no longer
    # anonymously pullable, which passes locally off a warm cache and
    # fails every CI run on a cold one.
    #
    # Pinned, like every other image here. `:latest` means a green build
    # today and a red one tomorrow with an unchanged commit.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ayana-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The bucket, created once at startup.
  #
  # storage.New deliberately does NOT create it on demand: a bucket
  # conjured by the first write hides a misconfigured bucket name behind
  # a service that looks healthy, and the first symptom is objects
  # nobody can find. So something has to provision it, and locally that
  # is this container — in production it is terraform.
  #
  # Runs to completion and exits; `mc mb --ignore-existing` makes a
  # restart a no-op rather than an error.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ayana-minio-init
    # Behind a profile, so a plain `docker compose up` does not start it.
    #
    # Not tidiness — `up --wait` blocks until every started service is
    # running or healthy, and a service that runs to completion and exits
    # 0 is reported as a FAILURE by that flag. Adding this container
    # without the profile broke `scripts/ayana up` outright: the
    # infrastructure came up healthy and the script then died with
    # "docker compose failed".
    #
    # The callers that need the bucket run this profile explicitly, which
    # also makes the ordering visible at the call site rather than
    # implied by a depends_on nobody reads.
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/astro-dev &&
      echo 'bucket astro-dev ready'
      "

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: ayana-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  astro:
    build:
      context: ./services/astro
    container_name: ayana-astro
    # Bound to the loopback interface only. `ports: ["8100:8100"]` would
    # publish on 0.0.0.0 — reachable from anything on the same network.
    #
    # astro-service and ai-service must never be reachable from outside
    # the host; api-service is the only public surface. The port is still
    # published at all so `task dev:api` (running from source, outside the
    # compose network) can reach them.
    ports: ["127.0.0.1:8100:8100"]
    environment:
      ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_TOKEN: *internal-token
      # NOTE: deliberately no model provider configuration. This service
      # must never be able to reach an LLM. See ADR-001.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ai:
    build:
      context: ./services/ai
    container_name: ayana-ai
    # Loopback only — see the note on astro above.
    ports: ["127.0.0.1:8200:8200"]
    environment:
      ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_TOKEN: *internal-token
      # READ-ONLY role. Note this is the in-network port (5432), not the
      # remapped host port.
      AI_DATABASE_URL: postgresql://astro_ro:astro_ro@postgres:5432/astro_dev
      # Reach the host's Ollama from inside the container.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_PROVIDER_TIER: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  miniodata:
